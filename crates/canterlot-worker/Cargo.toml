[package]
name = "canterlot-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
synthetic-adapter = []
# Настоящий `opencode` с локальной заглушкой провайдера (L2). Тесты помечены `ignore`:
# `--all-features` их собирает, но check.sh не запускает, см. README.
opencode-live = ["synthetic-adapter"]
fault-injection = ["canterlot-hub/fault-injection"]

[[bin]]
name = "fake-opencode"
required-features = ["synthetic-adapter"]

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
canterlot-journal = { version = "1.0.0", path = "../canterlot-journal" }
canterlot-proto = { version = "1.0.0", path = "../canterlot-proto" }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
humantime-serde = "1.1.1"
prost = "0.14.4"
rand = "0.10.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "json"] }
rustix = { version = "1.1.5", features = ["fs", "param", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "process", "net", "io-std", "io-util", "fs"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v5", "v7", "serde"] }

[dev-dependencies]
canterlot-hub = { path = "../canterlot-hub", features = ["testkit"] }
jsonschema = { version = "0.60.2", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "migrate", "macros"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["net", "process", "test-util"] }
