# Generated by canterlot; rewritten on every install and update.
database_url_file = "/etc/canterlot/hub/db.url"
grpc_listen = "0.0.0.0:7443"
tls_cert = "/etc/canterlot/hub/tls/hub.crt"
tls_key = "/etc/canterlot/hub/tls/hub.key"
tls_ca = "/etc/canterlot/hub/tls/ca.crt"
manifest = "/etc/canterlot/manifest/installation.toml"

[http]
listen = "0.0.0.0:8080"
trusted_proxies = ["172.30.231.0/24"]
owner_login = "owner"
allowed_origins = ["https://192.0.2.10"]
proxy_secret_file = "/etc/canterlot/hub/proxy.secret"

[attachments]
blob_dir = "/var/lib/canterlot/hub/attachments"

[auth.geoip]
path = "/var/lib/canterlot/hub/geoip/dbip-city-lite.mmdb"

[enroll]
grpc_endpoint = "192.0.2.10:7443"
