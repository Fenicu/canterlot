# Generated by canterlot; rewritten on every install and update.
name: canterlot
services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-superuser
    volumes:
      - /var/lib/canterlot/postgres:/var/lib/postgresql
      - /etc/canterlot/compose/postgres.secret:/run/secrets/postgres-superuser:ro
    networks:
      - canterlot
  hub:
    image: debian:trixie-slim
    restart: unless-stopped
    user: "980:980"
    command: ["/opt/canterlot/hub/current/bin/canterlot-hub", "serve", "--config", "/etc/canterlot/hub/hub.toml"]
    depends_on:
      - postgres
    volumes:
      - /opt/canterlot/hub/releases/1.2.3:/opt/canterlot/hub/current:ro
      - /etc/canterlot/hub:/etc/canterlot/hub:ro
      - /etc/canterlot/manifest:/etc/canterlot/manifest:ro
      - /var/lib/canterlot/hub:/var/lib/canterlot/hub
    ports:
      - "7444:7443"
    networks:
      - canterlot
  hub-init:
    image: debian:trixie-slim
    profiles:
      - init
    user: "980:980"
    command: ["/opt/canterlot/hub/current/bin/canterlot-hub", "init", "--config", "/etc/canterlot/hub/hub.toml"]
    depends_on:
      - postgres
    volumes:
      - /opt/canterlot/hub/releases/1.2.3:/opt/canterlot/hub/current:ro
      - /etc/canterlot/hub:/etc/canterlot/hub:ro
      - /etc/canterlot/manifest:/etc/canterlot/manifest
      - /var/lib/canterlot/hub:/var/lib/canterlot/hub
    networks:
      - canterlot
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - hub
    volumes:
      - /opt/canterlot/web:/srv/canterlot-web:ro
      - /etc/canterlot/compose/caddy:/etc/caddy:ro
      - /etc/canterlot/hub/proxy.secret:/run/secrets/canterlot-proxy:ro
      - /var/lib/canterlot/caddy:/data
    ports:
      - "8080:80"
    networks:
      - canterlot
networks:
  canterlot:
    ipam:
      config:
        - subnet: 172.30.231.0/24
