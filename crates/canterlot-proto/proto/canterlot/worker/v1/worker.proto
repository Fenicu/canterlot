// Номера удалённых полей объявляются reserved и никогда не используются повторно.
syntax = "proto3";

package canterlot.worker.v1;

service WorkerControl {
  rpc Control(stream ControlUp) returns (stream ControlDown);
}

service WorkerData {
  rpc Data(stream DataUp) returns (stream DataDown);
  rpc FetchAttachment(FetchAttachmentRequest) returns (stream AttachmentChunk);
  rpc PutMedia(stream MediaChunk) returns (MediaStored);
  rpc AgentCall(AgentCallRequest) returns (AgentCallResponse);
}

enum StreamKind {
  STREAM_KIND_UNSPECIFIED = 0;
  STREAM_KIND_CONTROL = 1;
  STREAM_KIND_DATA = 2;
}

enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_CREDENTIAL_REVOKED = 1;
  REJECT_REASON_INSTALLATION_MISMATCH = 2;
  REJECT_REASON_PROTOCOL_INCOMPATIBLE = 3;
  REJECT_REASON_UNKNOWN_REQUIRED_CAPABILITY = 4;
  REJECT_REASON_IDENTITY_IN_USE = 5;
  REJECT_REASON_CONNECTION_BINDING_MISMATCH = 6;
  REJECT_REASON_HUB_NOT_OPERATIONAL = 7;
  REJECT_REASON_LOCAL_STATE_RESET = 8;
}

message Hello {
  string installation_id = 1;
  string machine_id = 2;
  string restore_generation = 3;
  uint32 protocol_version = 4;
  repeated string required_capabilities = 5;
  repeated string optional_capabilities = 6;
  string connection_id = 7;
  string cj_journal_id = 8;
  repeated JournalCursor cursors = 9;
  string boot_id = 10;
  StreamKind stream_kind = 11;
  uint64 machine_time_ms = 12;
}

message JournalCursor {
  string journal_id = 1;
  uint64 first_stored_seq = 2;
  uint64 last_seq = 3;
  uint64 acked_seq_known_to_worker = 4;
}

message HelloReply {
  oneof result {
    Accepted accepted = 1;
    Rejected rejected = 2;
  }
}

message Accepted {
  string restore_generation = 1;
  repeated JournalCommitted committed = 2;
  repeated string capabilities = 3;
}

message JournalCommitted {
  string journal_id = 1;
  uint64 committed_seq = 2;
}

message Rejected {
  RejectReason reason = 1;
  string detail = 2;
  bool retryable = 3;
}

message ControlUp {
  oneof msg {
    Hello hello = 1;
    JournalRecords cj_records = 2;
    Heartbeat heartbeat = 3;
    ReconcileReport reconcile_report = 4;
    MachineReport machine_report = 5;
    MachineMetrics machine_metrics = 6;
    LimitsReport limits_report = 7;
    WorkdirSuggestions workdir_suggestions = 8;
    OwnerInstructionsOverview owner_overview = 9;
    OwnerInstructionsFile owner_file = 10;
    ClaudeHistories claude_histories = 11;
    // Только при согласованной возможности path_probe_v1.
    PathProbe path_probe = 12;
    // Только при согласованной возможности resource_lease_v1.
    LeaseState lease_state = 13;
    // Только при согласованной возможности watchdog_v1. Номер 13 оставлен
    // под состояние очереди тяжёлых задач.
    MachineWatch machine_watch = 14;
  }
}

message ReconcileReport {
  repeated ExecutionObservation executions = 1;
}

message ExecutionObservation {
  string execution_id = 1;
  uint64 generation = 2;
  string state = 3;
  string outcome = 4;
  bool supervisor_attached = 5;
  string sj_journal_id = 6;
}

message ControlDown {
  oneof msg {
    HelloReply hello_reply = 1;
    Command command = 2;
    JournalRangeAck cj_ack = 3;
    HeartbeatAck heartbeat_ack = 4;
    PollLimits poll_limits = 5;
    LimitsSnapshot limits_snapshot = 6;
    SuggestWorkdirs suggest_workdirs = 7;
    ReadOwnerInstructions read_owner = 8;
    ListClaudeHistories list_claude_histories = 9;
    // Только при согласованной возможности path_probe_v1.
    ProbePath probe_path = 10;
  }
}

message DataUp {
  oneof msg {
    Hello hello = 1;
    JournalRecords sj_records = 2;
  }
}

message DataDown {
  oneof msg {
    HelloReply hello_reply = 1;
    JournalRangeAck sj_ack = 2;
  }
}

message Heartbeat {
  uint64 seq = 1;
  uint64 machine_time_ms = 2;
}

message HeartbeatAck {
  uint64 seq = 1;
}

message JournalRangeAck {
  string journal_id = 1;
  uint64 up_to_seq = 2;
}

message JournalRecords {
  string journal_id = 1;
  repeated JournalRecord records = 2;
}

message JournalRecord {
  uint64 seq = 1;
  RecordBody body = 2;
}

message Command {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  string execution_id = 3;
  uint64 execution_generation = 4;
  oneof kind {
    DeliverInput deliver_input = 10;
    CancelInput cancel_input = 11;
    WithdrawInput withdraw_input = 12;
    Interrupt interrupt = 13;
    StartExecution start_execution = 14;
    StopExecution stop_execution = 15;
    DeliverDecision deliver_decision = 16;
    CompactSession compact_session = 17;
    // Только при согласованной возможности session_tools_v1.
    RemoveWorktree remove_worktree = 18;
    // Только при согласованной возможности owner_exit_v1.
    ResolveOwnerLost resolve_owner_lost = 19;
    // Только при согласованной возможности send_now_v1: влить ожидающий ввод
    // в идущий ход, не открывая нового.
    SteerInput steer_input = 20;
  }
}

/// Влить ожидающий ввод в идущий ход («Отправить сейчас»). Несёт тот же ввод,
/// что `deliver_input`, плюс ход, к которому его присоединить: воркер вольно
/// отказаться (хода уже нет, запрос открыт, сжатие), тогда ввод остаётся в очереди.
message SteerInput {
  string input_id = 1;
  string conversation_id = 2;
  repeated ContentBlock content = 3;
  SettingsOverride settings = 4;
  // Команда `deliver_input`, чей ход принимает ввод; пусто — любой идущий ход.
  string expected_running_command_id = 5;
}

// Решение владельца: завершить остаток группы потерянного исполнения.
message ResolveOwnerLost {}

message DeliverInput {
  string input_id = 1;
  string conversation_id = 2;
  repeated ContentBlock content = 3;
  SettingsOverride settings = 4;
}

message ContentBlock {
  oneof block {
    TextBlock text = 1;
    AttachmentRef attachment = 2;
  }
}

message TextBlock {
  string text = 1;
}

message CancelInput {
  string target_command_id = 1;
  uint32 target_dispatch_attempt = 2;
}

message WithdrawInput {
  string target_command_id = 1;
  uint32 target_dispatch_attempt = 2;
}

message Interrupt {}

// Сжать контекст живой сессии. Тратит токены, поэтому только по действию владельца.
message CompactSession {}

message StartExecution {
  string conversation_id = 1;
  string harness = 2;
  string workdir = 3;
  string native_conversation_id = 4;
  string model = 5;
  string effort = 6;
  string permission_mode = 7;
  reserved 8;
  repeated string capabilities = 9;
  Instructions instructions = 10;
  // Только при согласованной возможности session_tools_v1: воркер готовит рабочую копию до запуска.
  WorktreeSpec worktree = 11;
  // Только при согласованной возможности session_tools_v1: делегированная сессия не грузит MCP-серверы владельца.
  bool isolate_mcp = 12;
  // Только при согласованной возможности prompt_suggestions_v1: подсказки следующего сообщения Claude Code.
  bool prompt_suggestions = 13;
}

// Изолированная рабочая копия git: путь воркер строит сам из корня рабочих копий.
message WorktreeSpec {
  string source_workdir = 1;
  string branch = 2;
  string base = 3;
}

// Убрать рабочую копию после приёма результата. Путь и ветку хаб берёт из своей записи.
message RemoveWorktree {
  string source_workdir = 1;
  string path = 2;
  string branch = 3;
  bool force = 4;
}

message StopExecution {
  bool force = 1;
}

message RecordBody {
  oneof body {
    CommandStored command_stored = 1;
    CommandRejected command_rejected = 2;
    InputTransmissionStarted transmission_started = 3;
    InputAccepted input_accepted = 4;
    InputAcceptanceUnconfirmed acceptance_unconfirmed = 5;
    InputCancelWon cancel_won = 6;
    InputCancelLost cancel_lost = 7;
    InputWithdrawn input_withdrawn = 8;
    InputRejected input_rejected = 9;
    ExecutionState execution_state = 10;
    RunFinished run_finished = 11;
    JournalClosed journal_closed = 12;
    BlockStarted block_started = 13;
    BlockDelta block_delta = 14;
    BlockFinal block_final = 15;
    BlockIncomplete block_incomplete = 16;
    PhaseChanged phase_changed = 17;
    InputDispatchDeferred dispatch_deferred = 18;
    JournalOpened journal_opened = 19;
    InterruptStatus interrupt_status = 20;
    WithdrawRefused withdraw_refused = 21;
    AdapterDiagnostic adapter_diagnostic = 22;
    LimitObservation limit_observed = 23;
    LimitReached limit_reached = 24;
    AttachmentReady attachment_ready = 25;
    AttachmentFailed attachment_failed = 26;
    BlockMedia block_media = 27;
    RequestOpened request_opened = 28;
    RequestClosed request_closed = 29;
    DecisionTransmissionStarted decision_transmission_started = 30;
    DecisionApplied decision_applied = 31;
    DecisionNotApplied decision_not_applied = 32;
    DecisionUnconfirmed decision_unconfirmed = 33;
    // Только при согласованной возможности todo_v1.
    TodoUpdated todo_updated = 34;
    // Только при согласованной возможности compact_v1.
    SessionStuck session_stuck = 35;
    CompactionStatus compaction_status = 36;
    // Только при согласованной возможности background_v1.
    BackgroundWorkChanged background_work_changed = 37;
    // Только при согласованной возможности session_tools_v1.
    WorktreeRemoved worktree_removed = 38;
    // Только при согласованной возможности compact_v1: durable timeline of
    // context compactions (auto and manual) and live context fill.
    CompactionEvent compaction_event = 39;
    ContextProgress context_progress = 40;
    // Только при согласованной возможности session_tools_v1: файл, отданный владельцу.
    BlockFile block_file = 41;
    // Только при согласованной возможности prompt_suggestions_v1.
    PromptSuggested prompt_suggested = 42;
  }
}

message CommandStored {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  uint64 machine_time_ms = 3;
}

message CommandRejected {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  string reason = 3;
}

message InputTransmissionStarted {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  uint64 machine_time_ms = 3;
}

message InputAccepted {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  uint64 machine_time_ms = 3;
}

message InputAcceptanceUnconfirmed {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  string reason = 3;
}

message InputCancelWon {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
}

message InputCancelLost {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  string reason = 3;
}

message InputWithdrawn {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
}

message InputRejected {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  string reason = 3;
}

message InputDispatchDeferred {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  string reason = 3;
}

message ExecutionState {
  string execution_id = 1;
  uint64 generation = 2;
  string state = 3;
  string outcome = 4;
  string native_conversation_id = 5;
}

message RunFinished {
  string execution_id = 1;
  string input_command_id = 2;
  repeated ModelUsage usage = 3;
  uint64 context_tokens = 4;
  uint64 context_window_tokens = 5;
  uint64 duration_ms = 6;
  uint64 machine_time_ms = 7;
  // Запуск без ввода, приписанный команде: расход добавляется к её законченному ходу.
  bool adopted = 8;
  // Только при согласованной возможности session_tools_v1.
  GitFacts git = 9;
}

message GitCommit {
  string sha = 1;
  string subject = 2;
  // Время коммита в миллисекундах Unix; 0 у старого воркера.
  int64 committed_at_ms = 3;
}

message GitFile {
  string path = 1;
  string status = 2;
}

// Факты git на конец хода; пределы: 50 коммитов, 200 файлов, 32 КиБ в сумме.
message GitFacts {
  bool available = 1;
  string head_before = 2;
  string head_after = 3;
  bool dirty = 4;
  bool truncated = 5;
  repeated GitCommit commits = 6;
  repeated GitFile files = 7;
}

message WorktreeRemoved {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  // removed | dirty | failed
  string outcome = 3;
  // Короткий код без путей.
  string detail = 4;
  bool branch_kept = 5;
}

message JournalClosed {
  string execution_id = 1;
  uint64 generation = 2;
  string reason = 3;
}

message BlockStarted {
  string block_id = 1;
  uint64 rev = 2;
  string kind = 3;
  string input_command_id = 4;
  string parent_block_id = 5;
  string agent = 6;
  string model = 7;
  string tool_name = 8;
  string summary = 9;
  string approved_by = 10;
}

message BlockDelta {
  string block_id = 1;
  uint64 base_rev = 2;
  uint64 rev = 3;
  string append = 4;
}

message BlockFinal {
  string block_id = 1;
  uint64 rev = 2;
  string text = 3;
  string checksum = 4;
  bool text_omitted = 5;
  string summary = 6;
}

message BlockIncomplete {
  string block_id = 1;
  uint64 rev = 2;
  string reason = 3;
}

message PhaseChanged {
  string execution_id = 1;
  string phase = 2;
  string tool_name = 3;
  string summary = 4;
}

message JournalOpened {
  string execution_id = 1;
  uint64 generation = 2;
  uint32 supervisor_protocol_version = 3;
}

enum InterruptState {
  INTERRUPT_STATE_UNSPECIFIED = 0;
  SENT_TO_AGENT = 1;
  ACKNOWLEDGED = 2;
  COMPLETED = 3;
  NOT_APPLICABLE = 4;
  SUPERSEDED = 5;
  REJECTED_STALE = 6;
}

message InterruptStatus {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  InterruptState state = 3;
}

message WithdrawRefused {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  string reason = 3;
}

message AdapterDiagnostic {
  string execution_id = 1;
  string kind = 2;
  string event_type = 3;
  // Имена ключей неизвестного кадра: отсортированы, не больше 32, до 64 символов.
  repeated string field_names = 4;
}

// Необязательная возможность pilot_v1 предлагается в Hello и повторяется в Accepted.
message MachineReport {
  string worker_version = 1;
  repeated string allowed_roots = 2;
  repeated HarnessInfo harnesses = 3;
  reserved 4;
  uint64 max_attachment_bytes = 5;
  uint32 max_attachments_per_input = 6;
  string containment = 7;
  string os = 8;
  // Домашний каталог пользователя воркера; пусто, если воркер его не знает.
  string home_dir = 9;
  // Корень изолированных рабочих копий; пусто, если воркер их не поддерживает.
  string worktree_root = 10;
}

message HarnessInfo {
  string harness = 1;
  string provider = 2;
  string title = 3;
  bool images = 4;
  bool settings_midsession = 5;
  repeated string permission_modes = 6;
  repeated ModelInfo models = 7;
  optional bool settings_midsession_effort = 8;
}

message ModelInfo {
  string id = 1;
  string title = 2;
  repeated string efforts = 3;
  optional bool images = 4;
  optional uint64 context_window = 5;
}

message MachineMetrics {
  uint64 machine_time_ms = 1;
  uint32 cpu_cores = 2;
  // Тысячные доли всей машины, 0..1000.
  uint32 cpu_permille = 3;
  uint64 mem_total_bytes = 4;
  uint64 mem_available_bytes = 5;
  repeated DiskUsage disks = 6;
  uint32 load1_centi = 7;
  uint32 load5_centi = 8;
  uint32 load15_centi = 9;
  repeated ExecutionProcess executions = 10;
}

message DiskUsage {
  string label = 1;
  uint64 total_bytes = 2;
  uint64 free_bytes = 3;
}

message ExecutionProcess {
  string execution_id = 1;
  bool alive = 2;
  // Тысячные доли одного ядра, сумма по дереву процессов исполнения:
  // многопоточный CLI или сборка даёт больше 1000 (2400 = 2,4 ядра).
  uint32 cpu_permille = 3;
  uint64 rss_bytes = 4;
  // Живые потомки CLI без зомби. Нет поля — старый воркер, неизвестно.
  optional uint32 descendants = 5;
}

// Сторож машины: кэш крупных каталогов сборки, процессы, пережившие свои
// исполнения, и число сборок вне очереди. Шлётся раз в 5 минут и сразу, когда
// свободное место пересекает порог предупреждения. Размеры меряются в фоне,
// поэтому показание может отставать от диска до часа (`measured_at_ms`).
message MachineWatch {
  repeated DiskHotspot hotspots = 1;
  repeated LeakedProcess leaked = 2;
  uint32 unleased_count = 3;
  uint64 observed_at_ms = 4;
}

message DiskHotspot {
  string path = 1;
  // `target`, `node_modules`, `svelte_kit` или `web_build`.
  string kind = 2;
  uint64 bytes = 3;
  // Для `target`: сумма `*/incremental`.
  uint64 incremental_bytes = 4;
  // Последняя запись сборки; 0 — неизвестно.
  uint64 newest_ms = 5;
  uint64 measured_at_ms = 6;
  // Рабочая копия беседы под корнем рабочих копий; пусто — каталог владельца.
  string conversation_id = 7;
}

// Только `comm`: ни аргументов, ни окружения.
message LeakedProcess {
  string execution_id = 1;
  uint32 pid = 2;
  string comm = 3;
  uint64 rss_bytes = 4;
  uint64 age_s = 5;
}

enum LimitWindow {
  LIMIT_WINDOW_UNSPECIFIED = 0;
  LIMIT_WINDOW_FIVE_HOUR = 1;
  LIMIT_WINDOW_WEEKLY = 2;
  LIMIT_WINDOW_MONTHLY = 3;
  LIMIT_WINDOW_WEEKLY_FABLE = 4;
}

// Насколько показание окна близко к данным провайдера. Пустое значение —
// отчёт старого воркера, клиенты считают его точным.
enum LimitDataConfidence {
  LIMIT_DATA_CONFIDENCE_UNSPECIFIED = 0;
  LIMIT_DATA_CONFIDENCE_EXACT = 1;
  LIMIT_DATA_CONFIDENCE_ESTIMATED = 2;
}

message LimitObservation {
  string provider = 1;
  LimitWindow window = 2;
  uint32 used_permille = 3;
  uint64 resets_at_ms = 4;
  uint64 observed_machine_ms = 5;
  LimitDataConfidence data_confidence = 6;
}

// Окно, которого у провайдера нет: полное успешное чтение не содержит его при других окнах.
message LimitAbsence {
  string provider = 1;
  LimitWindow window = 2;
  uint64 observed_machine_ms = 3;
}

message LimitsReport {
  repeated LimitObservation observations = 1;
  repeated LimitAbsence absent = 2;
}

message PollLimits {
  string provider = 1;
  // Просьба владельца: воркер не ждёт ни интервала опроса, ни паузы после сбоев.
  bool owner_refresh = 2;
}

message LimitsSnapshot {
  string provider = 1;
  repeated LimitObservation current = 2;
  bool weekly_reserve_active = 3;
}

message LimitReached {
  string execution_id = 1;
  string provider = 2;
  LimitWindow window = 3;
  uint64 resets_at_ms = 4;
  string input_command_id = 5;
}

// Необязательная возможность workdir_suggest_v1: подсказка рабочей папки во время
// ввода. Пути не пишутся в журналы (см. redacted_debug.rs).
message SuggestWorkdirs {
  string request_id = 1;
  string path = 2;
}

message WorkdirSuggestions {
  string request_id = 1;
  repeated string directories = 2;
}

// Необязательная возможность claude_histories_v1: беседы Claude Code выбранного
// рабочего каталога, которые можно продолжить новой сессией.
message ListClaudeHistories {
  string request_id = 1;
  string workdir = 2;
}

message ClaudeHistory {
  string id = 1;
  uint64 modified_at_ms = 2;
  uint64 size = 3;
  string preview = 4;
}

message ClaudeHistories {
  string request_id = 1;
  repeated ClaudeHistory items = 2;
}

// Необязательная возможность path_probe_v1: проверка пути на машине вызывающей
// сессии. Путь абсолютный (относительный разрешает хаб), сначала проверяется
// защитой `share_file`, затем отдаётся только факт о файле. Потолок `head` —
// MAX_PROBE_HEAD_BYTES, `0` значит «не читать».
message ProbePath {
  string request_id = 1;
  string path = 2;
  uint32 read_head_bytes = 3;
}

message PathProbe {
  string request_id = 1;
  oneof outcome {
    PathProbeExists exists = 2;
    PathProbeMissing missing = 3;
    PathProbeNotAllowed not_allowed = 4;
    PathProbeError error = 5;
  }
  // Часы воркера в момент ответа: граница «написано после взвода» не зависит
  // от расхождения часов хаба и машины.
  uint64 now_ms = 6;
}

message PathProbeExists {
  uint64 size = 1;
  uint64 mtime_ms = 2;
  // Первые байты файла: только по просьбе и только если это текст.
  string head = 3;
  // Пусто, `binary` (не текст) или `not_requested`.
  string head_omitted = 4;
}

message PathProbeMissing {}

message PathProbeNotAllowed {
  string reason = 1;
}

message PathProbeError {
  string reason = 1;
}

// Чтение глобальных инструкций владельца: запрос называет только вид,
// для памяти — идентификатор проекта из обзора и имя файла, никогда путь.
// Виды: overview, claude_user, claude_home, codex_global, codex_override,
// opencode_global, memory_index, memory_file.
message ReadOwnerInstructions {
  string request_id = 1;
  string kind = 2;
  string project = 3;
  string name = 4;
}

message OwnerFileMeta {
  string kind = 1;
  string path = 2;
  bool present = 3;
  uint64 size = 4;
  uint64 mtime_ms = 5;
  // Почему файл не показан при present = false: пусто или "symlink".
  string reason = 6;
}

message OwnerMemoryProject {
  string id = 1;
  uint64 files = 2;
  bool has_index = 3;
}

message OwnerMemoryFile {
  string name = 1;
  uint64 size = 2;
  uint64 mtime_ms = 3;
}

// Обзор без содержимого: метаданные глобальных файлов и список проектов памяти.
message OwnerInstructionsOverview {
  string request_id = 1;
  repeated OwnerFileMeta files = 2;
  repeated OwnerMemoryProject projects = 3;
}

// Один файл: содержимое урезано до 256 КиБ с признаком, у memory_index
// дополнительно список файлов проекта. При present = false поле reason
// объясняет причину: пусто или "symlink".
message OwnerInstructionsFile {
  string request_id = 1;
  string kind = 2;
  string path = 3;
  bool present = 4;
  uint64 size = 5;
  uint64 mtime_ms = 6;
  bool truncated = 7;
  string content = 8;
  repeated OwnerMemoryFile files = 9;
  string reason = 10;
}

message ModelUsage {
  string model = 1;
  string agent = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  uint64 cache_read_tokens = 5;
  uint64 cache_write_tokens = 6;
}

message SettingsOverride {
  string model = 1;
  string effort = 2;
  string permission_mode = 3;
  Instructions instructions = 4;
}

// Инструкции агента на одно исполнение или смену настроек: текст — данные
// уровня сообщения, в журналах и Debug его нет (см. redacted_debug.rs).
message Instructions {
  // "clean" | "owner" | "preset".
  string mode = 1;
  // Только preset, 1..=MAX_PRESET_TEXT_BYTES байт.
  string text = 2;
  // Только preset, UUID пресета.
  string preset_id = 3;
  // Только preset.
  uint64 revision = 4;
  // Только preset; заметка для смены Codex.
  string title = 5;
}

message AgentCallRequest {
  string execution_id = 1;
  uint64 generation = 2;
  string call_id = 3;
  string tool = 4;
  string arguments_json = 5;
}

message AgentCallResponse {
  string result_json = 1;
  string error_code = 2;
  string error_message = 3;
}

message AttachmentRef {
  string attachment_id = 1;
  string name = 2;
  string mime = 3;
  uint64 size = 4;
  string sha256 = 5;
  bool image = 6;
}

message FetchAttachmentRequest {
  string attachment_id = 1;
  uint64 offset = 2;
}

message AttachmentChunk {
  uint64 offset = 1;
  bytes data = 2;
  bool last = 3;
}

message AttachmentReady {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  string attachment_id = 3;
}

message AttachmentFailed {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  string attachment_id = 3;
  string reason = 4;
  bool retryable = 5;
}

// Картинка, которую видел агент: первый кадр несёт заголовок, следующие - данные до 131072 байт.
message MediaHeader {
  string media_id = 1;
  string execution_id = 2;
  string block_id = 3;
  string mime = 4;
  uint64 size = 5;
  string sha256 = 6;
  // Общий файл для владельца: имя, заголовок и заметка; без share — картинка агента.
  string name = 7;
  string title = 8;
  string note = 9;
  bool share = 10;
  uint32 width = 11;
  uint32 height = 12;
}

message MediaChunk {
  oneof part {
    MediaHeader header = 1;
    bytes data = 2;
  }
}

message MediaStored {
  string media_id = 1;
}

// Пишется сопровождением только после MediaStored: хаб не видит ссылок на неопубликованное.
message BlockFile {
  string block_id = 1;
  string attachment_id = 2;
  string name = 3;
  string mime = 4;
  uint64 size = 5;
  string sha256 = 6;
  string title = 7;
  string note = 8;
  uint32 width = 9;
  uint32 height = 10;
}

message BlockMedia {
  string block_id = 1;
  string media_id = 2;
  string mime = 3;
  uint64 size = 4;
  string sha256 = 5;
  uint32 width = 6;
  uint32 height = 7;
}

message DeliverDecision {
  string request_id = 1;
  string decision_id = 2;
  uint64 generation = 3;
  string kind = 4;
  bytes decision_payload_json = 5;
}

message RequestOpened {
  string request_id = 1;
  string execution_id = 2;
  uint64 generation = 3;
  string kind = 4;
  bytes payload_json = 5;
}

message RequestClosed {
  string request_id = 1;
  string reason = 2;
}

enum TodoStatus {
  TODO_STATUS_UNSPECIFIED = 0;
  TODO_STATUS_PENDING = 1;
  TODO_STATUS_IN_PROGRESS = 2;
  TODO_STATUS_COMPLETED = 3;
  TODO_STATUS_CANCELLED = 4;
}

// Один и тот же отказ провайдера подряд: следующий ввод получит то же самое.
message SessionStuck {
  string execution_id = 1;
  uint64 generation = 2;
}

enum CompactionState {
  COMPACTION_STATE_UNSPECIFIED = 0;
  COMPACTION_STATE_SENT_TO_AGENT = 1;
  COMPACTION_STATE_COMPLETED = 2;
  COMPACTION_STATE_FAILED = 3;
  COMPACTION_STATE_NOT_APPLICABLE = 4;
  COMPACTION_STATE_SUPERSEDED = 5;
  COMPACTION_STATE_REJECTED_STALE = 6;
}

message CompactionStatus {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  CompactionState state = 3;
}

// Durable timeline record of one context compaction episode. Start and finish
// share `id`: finish without a recorded start (reconnect) opens and closes at
// once. `pre_tokens` is 0 when the CLI did not report it.
message CompactionEvent {
  string id = 1;
  string execution_id = 2;
  uint64 generation = 3;
  bool started = 4;
  bool manual = 5;
  bool ok = 6;
  uint64 pre_tokens = 7;
}

// Live context fill during a turn, rate limited by the adapter. Hub keeps only
// the latest per execution; the turn-end RunFinished stays authoritative.
message ContextProgress {
  string execution_id = 1;
  uint64 generation = 2;
  uint64 context_tokens = 3;
  uint64 context_window_tokens = 4;
}

message TodoItem {
  string text = 1;
  TodoStatus status = 2;
}

// Предсказанное следующее сообщение владельца после хода. Текст — данные владельца, в логи не идёт.
message PromptSuggested {
  string execution_id = 1;
  uint64 generation = 2;
  string text = 3;
  // Ввод (command_id) хода, после которого пришла подсказка: хаб отбрасывает её, если у
  // разговора уже есть ввод новее.
  string input_command_id = 4;
}

// Полный список задач агента, не дельта: запись заменяет прежний список своей дорожки.
message TodoUpdated {
  string execution_id = 1;
  uint64 generation = 2;
  // Номер записи в SJ: растёт в пределах исполнения и переживает перезапуск сопровождения.
  uint64 revision = 3;
  // Блок вызова субагента; у основного агента пусто.
  string lane_block_id = 4;
  repeated TodoItem items = 5;
  // Сколько пунктов не поместилось в запись.
  uint32 omitted = 6;
}

enum BackgroundTaskKind {
  BACKGROUND_TASK_KIND_UNSPECIFIED = 0;
  BACKGROUND_TASK_KIND_AGENT = 1;
  BACKGROUND_TASK_KIND_BASH = 2;
}

enum BackgroundTaskState {
  BACKGROUND_TASK_STATE_UNSPECIFIED = 0;
  BACKGROUND_TASK_STATE_RUNNING = 1;
  BACKGROUND_TASK_STATE_COMPLETED = 2;
  BACKGROUND_TASK_STATE_FAILED = 3;
  BACKGROUND_TASK_STATE_STOPPED = 4;
}

message BackgroundTask {
  string task_id = 1;
  BackgroundTaskKind kind = 2;
  // Блок вызова Agent или Bash; пусто, пока CLI не назвал вызов.
  string block_id = 3;
  string parent_task_id = 4;
  string description = 5;
  BackgroundTaskState state = 6;
}

// Все работающие фоновые задачи исполнения и задачи, закончившиеся с прошлой записи.
message BackgroundWorkChanged {
  string execution_id = 1;
  uint64 generation = 2;
  // Номер записи в SJ: растёт в пределах исполнения и переживает перезапуск сопровождения.
  uint64 revision = 3;
  uint64 machine_time_ms = 4;
  repeated BackgroundTask tasks = 5;
  // Сколько задач не поместилось в запись: тогда пропавшие из списка не считаются законченными.
  uint32 omitted = 6;
  // Идёт ход, который CLI начал сам.
  bool wake_turn = 7;
}

// Намерение синхронизируется на диск до передачи решения адаптеру.
message DecisionTransmissionStarted {
  string request_id = 1;
  string decision_id = 2;
  uint64 machine_time_ms = 3;
}

message DecisionApplied {
  string request_id = 1;
  string decision_id = 2;
  string proof_kind = 3;
  bytes proof_payload_json = 4;
}

message DecisionNotApplied {
  string request_id = 1;
  string decision_id = 2;
  string reason = 3;
}

message DecisionUnconfirmed {
  string request_id = 1;
  string decision_id = 2;
  string reason = 3;
}

// Очередь тяжёлых задач машины целиком (не дельта): при каждом изменении и после
// переподключения. Воркер ведёт очередь сам, хаб только отражает её.
message LeaseState {
  uint32 slots = 1;
  repeated LeaseEntry holders = 2;
  repeated LeaseEntry waiters = 3;
  // Часы воркера в момент снимка.
  uint64 observed_at_ms = 4;
}

message LeaseEntry {
  string lease_id = 1;
  // `gate` или `build`.
  string kind = 2;
  uint32 weight = 3;
  string label = 4;
  // Пусто у держателя `owner` (процесс без метки исполнения).
  string execution_id = 5;
  // `execution` или `owner`.
  string holder = 6;
  // Время выдачи; 0 у ожидающих.
  uint64 since_ms = 7;
  uint64 requested_at_ms = 8;
  // Место в очереди с единицы; 0 у держателей.
  uint32 position = 9;
  // Имя рабочего каталога клиента.
  string dir = 10;
}
