syntax = "proto3";

package canterlot.worker.ipc.v1;

import "canterlot/worker/v1/worker.proto";

message ControlToSupervisor {
  oneof msg {
    Attach attach = 1;
    StartCli start_cli = 2;
    Deliver deliver = 3;
    canterlot.worker.v1.CancelInput cancel = 4;
    canterlot.worker.v1.WithdrawInput withdraw = 5;
    InterruptRequest interrupt = 6;
    StopRequest stop = 7;
    ShipFrom ship_from = 8;
    SjAck sj_ack = 9;
    MediaResult media_result = 10;
    canterlot.worker.v1.DeliverDecision deliver_decision = 11;
    AgentCallResult agent_call_result = 12;
    CompactRequest compact = 13;
  }
}

message SupervisorToControl {
  oneof msg {
    Attached attached = 1;
    CliStarted cli_started = 2;
    DeliverAck deliver_ack = 3;
    SjBatch sj_batch = 4;
    Exited exited = 5;
    MediaUpload media_upload = 6;
    DecisionAck decision_ack = 7;
    DecisionOutcome decision_outcome = 8;
    AgentCall agent_call = 9;
  }
}

message Attach {
  uint32 protocol_version = 1;
  bytes secret = 2;
  string execution_id = 3;
  uint64 generation = 4;
}

message Attached {
  uint32 protocol_version = 1;
  uint32 pid = 2;
  uint64 start_ticks = 3;
  string sj_journal_id = 4;
  uint64 last_sj_seq = 5;
  uint64 acked_sj_seq = 6;
  repeated ReceivedInput received = 7;
}

message ReceivedInput {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  string state = 3;
}

message StartCli {
  string profile = 1;
  string workdir = 2;
  string native_conversation_id = 3;
  string model = 4;
  string effort = 5;
  string permission_mode = 6;
  reserved 7;
  bool pilot_v1 = 8;
  canterlot.worker.v1.Instructions instructions = 9;
  bool todo_v1 = 10;
  bool compact_v1 = 11;
  bool background_v1 = 12;
  bool session_tools_v1 = 13;
  bool isolate_mcp = 14;
  // Возможность send_now_v1, согласованная хабом для этого исполнения.
  bool send_now_v1 = 15;
}

// Вызов инструмента агента: сопровождение → управляющий процесс → хаб и обратно.
// Аргументы и результат — данные уровня сообщения, в журналах их нет.
message AgentCall {
  string call_id = 1;
  string tool = 2;
  string arguments_json = 3;
}

message AgentCallResult {
  string call_id = 1;
  string result_json = 2;
  string error_code = 3;
  string error_message = 4;
}

message CliStarted {
  uint32 pid = 1;
  uint64 start_ticks = 2;
  string native_conversation_id = 3;
}

message Deliver {
  canterlot.worker.v1.Command command = 1;
  repeated LocalFile files = 2;
}

message DeliverAck {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  string result = 3;
}

message InterruptRequest {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
}

message CompactRequest {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
}

message StopRequest {
  string command_id = 1;
  uint32 dispatch_attempt = 2;
  bool force = 3;
}

message ShipFrom {
  uint64 committed_seq = 1;
}

message SjAck {
  uint64 up_to_seq = 1;
}

message SjBatch {
  string journal_id = 1;
  repeated canterlot.worker.v1.JournalRecord records = 2;
}

message Exited {
  string reason = 1;
}

enum OwnershipPhase {
  OWNERSHIP_PHASE_UNSPECIFIED = 0;
  OWNERSHIP_PHASE_SPAWNING = 1;
  OWNERSHIP_PHASE_ATTACHED = 2;
  OWNERSHIP_PHASE_RELEASED = 3;
}

message Ownership {
  string execution_id = 1;
  uint64 generation = 2;
  string conversation_id = 3;
  string boot_id = 4;
  string exec_dir = 5;
  uint32 supervisor_pid = 6;
  uint64 supervisor_start_ticks = 7;
  uint32 cli_pid = 8;
  uint64 cli_start_ticks = 9;
  string ipc_socket = 10;
  bytes secret_sha256 = 11;
  string sj_journal_id = 12;
  uint32 ipc_protocol_version = 13;
  OwnershipPhase phase = 14;
  string released_reason = 15;
  // Номер факта owner_reclaimed в CJ: более ранние факты owner_lost уже не действуют.
  uint64 reclaimed_cj_seq = 16;
}

message LocalFile {
  string path = 1;
  string name = 2;
  string mime = 3;
  uint64 size = 4;
  bool image = 5;
}

// Файл лежит в exec_dir/media/<media_id>; путь по IPC не передаётся.
message MediaUpload {
  string media_id = 1;
  string block_id = 2;
  string mime = 3;
  uint64 size = 4;
  string sha256 = 5;
}

message MediaResult {
  string media_id = 1;
  bool stored = 2;
  string reason = 3;
}

message DecisionAck {
  string request_id = 1;
  string decision_id = 2;
  string result = 3;
}

message DecisionOutcome {
  oneof outcome {
    canterlot.worker.v1.DecisionApplied applied = 1;
    canterlot.worker.v1.DecisionNotApplied not_applied = 2;
    canterlot.worker.v1.DecisionUnconfirmed unconfirmed = 3;
  }
}
