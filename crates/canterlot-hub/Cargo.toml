[package]
name = "canterlot-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "canterlot-hub"
path = "src/main.rs"

[features]
testkit = ["dep:rcgen", "dep:tower", "dep:http-body-util", "hyper-util/client-legacy", "dep:tokio-tungstenite"]
fault-injection = []

[dev-dependencies]
canterlot-hub = { path = ".", features = ["testkit"] }
jsonschema = { version = "0.60.2", default-features = false }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
rustix = { version = "1.1.6", features = ["process"] }
webauthn-authenticator-rs = { version = "0.6.2", default-features = false, features = ["softpasskey"] }
tokio = { version = "1.54.1", features = ["process", "sync", "test-util", "time"] }

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash", "getrandom"] }
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio", "ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
canterlot-proto = { version = "1.0.0", path = "../canterlot-proto" }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
futures-util = "0.3.34"
getrandom = "0.4.3"
http-body = "1.1.0"
http-body-util = { version = "0.1.5", optional = true }
humantime-serde = "1.1.1"
hyper-util = { version = "0.1.21", features = ["http1", "server-auto", "service", "tokio"] }
ipnet = { version = "2.12.2", features = ["serde"] }
maxminddb = { version = "0.32.0", features = ["mmap"] }
prost = "0.14.4"
rustix = { version = "1.1.6", features = ["termios"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "json"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "migrate", "macros", "chrono"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"], optional = true }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
toml = "1.1.8"
tonic = { version = "0.14.6", features = ["tls-ring"] }
tower = { version = "0.5.3", features = ["util"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
utoipa = { version = "6.0.0", features = ["uuid", "chrono"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation"] }
