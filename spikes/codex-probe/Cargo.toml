[package]
name = "codex-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Stage 0 probe: drive `codex app-server` over stdio and record evidence"

[workspace]

[dependencies]
anyhow = "1.0.104"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
