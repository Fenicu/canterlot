[package]
name = "claude-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
anyhow = "1.0.104"
nix = { version = "0.31.3", features = ["signal", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "time", "sync", "fs", "io-std", "signal"] }
uuid = { version = "1.29.0", features = ["v4"] }
