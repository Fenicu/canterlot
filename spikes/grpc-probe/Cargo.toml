[package]
name = "grpc-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
async-stream = "0.3.6"
prost = "0.14.4"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "net", "time", "process", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
uuid = { version = "1.29.0", features = ["v7"] }

[build-dependencies]
tonic-prost-build = "0.14.6"
