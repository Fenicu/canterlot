[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "1.55.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[workspace.lints.cargo]
unused_dependencies = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
