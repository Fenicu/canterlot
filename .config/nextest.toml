# Все тесты всех бинарников идут одним пулом: процесс на тест. Поэтому лимиты внутри процесса
# (семафоры, RUST_TEST_THREADS) здесь не работают, ограничения задают группы ниже.
# Число потоков равно числу ядер: при вдвое большем рядом с clippy тесты с сопровождением
# падают по таймингам, а выигрыша нет.
nextest-version = "0.9.120"

[test-groups]
# Тесты, поднимающие настоящее сопровождение (supervisor), воркер и хаб в одном процессе.
heavy-e2e = { max-threads = 24 }
# Проверяют, что большая передача не душит управляющий канал: нужна тихая машина, идут по одному
# и вместе с threads-required забирают долю пула.
starvation = { max-threads = 1 }

[profile.default]
fail-fast = false
status-level = "retry"
# Итог показывает проваленные, нестабильные (прошли с повтором) и медленные тесты.
final-status-level = "slow"
failure-output = "immediate-final"
slow-timeout = { period = "30s", terminate-after = 6 }

[profile.default.junit]
path = "junit.xml"
store-success-output = false

# Быстрая проверка (scripts/check.sh --fast): первая же ошибка останавливает прогон.
[profile.fast]
inherits = "default"
fail-fast = true

# Первое совпавшее правило задаёт параметр: сначала узкие правила, потом общие.
[[profile.default.overrides]]
filter = 'package(canterlot-worker) & binary(it) & (test(=exec_attachments::large_attachment_does_not_starve_control_session) | test(=exec_media::media_upload_does_not_starve_control_or_sj) | test(=exec_e2e::large_answer_backlog_does_not_starve_control_session))'
test-group = "starvation"
threads-required = 12
slow-timeout = { period = "30s", terminate-after = 8 }

[[profile.default.overrides]]
filter = 'package(canterlot-worker) & binary(it) & test(/^(attachments|claude_code_large_result|e2e|exec_attachments|exec_e2e|exec_media|opencode_worker|pilot_e2e|session_tools_e2e|supervisor|supervisor_requests)::/)'
test-group = "heavy-e2e"
slow-timeout = { period = "30s", terminate-after = 8 }

# Карантин нестабильных тестов. Повтор разрешён только здесь: каждая запись с причиной и строкой
# в .superpowers/carry/flaky-tests.md. Повтор виден в выводе как TRY n и итоговый FLAKY, молча
# ничего не перезапускается. Запись помечается строкой с причиной (слово в верхнем регистре, см. выше), её показывает
# scripts/list-quarantine.sh. Правила карантина идут выше; в вебе карантин
# ведётся такими же пометками в спеках Playwright.

# QUARANTINE: ожидание появления временного файла вложения (20 с) не укладывается в полный гейт под
# нагрузкой; отдельно и под нагрузкой из 24 ядер тест проходит (50 из 50). Повтор разрешён, чтобы не
# перезапускать гейт руками.
[[profile.default.overrides]]
filter = 'test(=exec_attachments::large_attachment_does_not_starve_control_session)'
retries = 2

# QUARANTINE: ловушка на взаимную блокировку с окном 20 с на 30 раундов; под нагрузкой полного гейта
# окно мало. Отдельно проходит. Повтор разрешён.
[[profile.default.overrides]]
filter = 'test(=session_subs::deleting_a_subscriber_during_refresh_does_not_deadlock)'
retries = 2

# QUARANTINE: старт воркера и переподключение ждутся по 45 с; в полном гейте под нагрузкой окно мало,
# отдельно тест проходит. Повтор разрешён.
[[profile.default.overrides]]
filter = 'test(=settings::settings_survive_worker_restart_between_dispatch_and_accept)'
retries = 2

# QUARANTINE: ожидание подъёма сессии (60 с) после убийства супервизора не укладывается в полный гейт
# под нагрузкой; отдельно проходит. Повтор разрешён.
[[profile.default.overrides]]
filter = 'test(=exec_e2e::killed_supervisor_with_nothing_left_fails_and_the_session_resumes)'
retries = 2

# QUARANTINE: внутреннее ожидание 10 с на подъём сессии и подтверждение журнала мало для полного гейта
# под нагрузкой; отдельно проходит. Повтор разрешён.
[[profile.default.overrides]]
filter = 'test(=session::task8::real::sj_batches_are_acked_and_compacted)'
retries = 2

# QUARANTINE: в полном гейте 1.22.3 тест шёл 67 с и упал при нагрузке; отдельно проходит за 12 с.
# Повтор разрешён.
[[profile.default.overrides]]
filter = 'test(=exec_e2e::transport_errors_never_stop_an_execution)'
retries = 2

# QUARANTINE: в полном гейте 1.23.2 (51 с) и в check.sh --fast 09.11 (37 с) под нагрузкой падал
# «stale batches forced another handshake» (3 вместо 2); отдельно проходит за ~15 с. Повтор разрешён.
[[profile.default.overrides]]
filter = 'test(=exec_e2e::wave_w_data_reattach_discards_stale_sj_batches)'
retries = 2
