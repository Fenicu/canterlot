# Все тесты всех бинарников идут одним пулом: процесс на тест. Поэтому лимиты внутри процесса
# (семафоры, RUST_TEST_THREADS) здесь не работают, ограничения задают группы ниже.
# Число потоков равно числу ядер: при вдвое большем рядом с clippy тесты с сопровождением
# падают по таймингам, а выигрыша нет.
nextest-version = "0.9.120"

[test-groups]
# Тесты, поднимающие настоящее сопровождение (supervisor), воркер и хаб в одном процессе.
heavy-e2e = { max-threads = 24 }
# Проверяют, что большая передача не душит управляющий канал: нужна тихая машина, идут по одному
# и вместе с threads-required забирают долю пула.
starvation = { max-threads = 1 }

[profile.default]
fail-fast = false
status-level = "retry"
# Итог показывает проваленные, нестабильные (прошли с повтором) и медленные тесты.
final-status-level = "slow"
failure-output = "immediate-final"
slow-timeout = { period = "30s", terminate-after = 6 }

[profile.default.junit]
path = "junit.xml"
store-success-output = false

# Быстрая проверка (scripts/check.sh --fast): первая же ошибка останавливает прогон.
[profile.fast]
inherits = "default"
fail-fast = true

# Первое совпавшее правило задаёт параметр: сначала узкие правила, потом общие.
[[profile.default.overrides]]
filter = 'package(canterlot-worker) & (test(=large_attachment_does_not_starve_control_session) | test(=media_upload_does_not_starve_control_or_sj) | test(=large_answer_backlog_does_not_starve_control_session))'
test-group = "starvation"
threads-required = 12
slow-timeout = { period = "30s", terminate-after = 8 }

[[profile.default.overrides]]
filter = 'package(canterlot-worker) & (binary(attachments) | binary(claude_code_large_result) | binary(e2e) | binary(exec_attachments) | binary(exec_e2e) | binary(exec_media) | binary(opencode_worker) | binary(pilot_e2e) | binary(session_tools_e2e) | binary(supervisor) | binary(supervisor_requests))'
test-group = "heavy-e2e"
slow-timeout = { period = "30s", terminate-after = 8 }

# QUARANTINE: падает только в полном прогоне рядом с параллельным clippy (3 из 3 прогонов с линтом, 0 из 12 отдельно): оборванное получение удержания после остановки воркера
[[profile.default.overrides]]
filter = 'package(canterlot-worker) & test(=media_upload_resumes_after_reconnect_without_duplicate_record)'
retries = 2

# Карантин нестабильных тестов. Повтор разрешён только здесь: каждая запись с причиной и строкой
# в .superpowers/carry/flaky-tests.md. Повтор виден в выводе как TRY n и итоговый FLAKY, молча
# ничего не перезапускается. Запись помечается строкой с причиной (слово в верхнем регистре, см. выше), её показывает
# scripts/list-quarantine.sh. Правила карантина идут выше; в вебе карантин
# ведётся такими же пометками в спеках Playwright.
