# Конфигурация выката пилота: имена хостов, пути и юниты.
# Секретов здесь нет: только имена. Значения секретов никогда не читаются и не печатаются.
# Умолчания — нейтральный пример. Значения своего стенда кладут в
# .superpowers/site.env (необязательный файл вне репозитория, путь переопределяет
# CANTERLOT_SITE_ENV); образец — docs/deploy/site.env.example.

# Значения стенда читаются до умолчаний и задают только то, чего нет в окружении:
# явная переменная окружения по-прежнему главнее файла.
CANTERLOT_SITE_ENV="${CANTERLOT_SITE_ENV:-$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)/.superpowers/site.env}"
if [[ -f "${CANTERLOT_SITE_ENV}" ]]; then
    # shellcheck disable=SC1090 # файл стенда, путь задаётся снаружи
    source "${CANTERLOT_SITE_ENV}"
fi

# Хосты SSH (алиасы из ~/.ssh/config на машине воркера).
HUB_SSH="${HUB_SSH:-hub}"                    # хаб, root
WEB_SSH="${WEB_SSH:-web}"                    # хост Caddy
PROXMOX_SSH="${PROXMOX_SSH:-proxmox}"         # гипервизор, vzdump и статус CT
# Имя ноды PvE для pvesh-запросов блокировок CT.
# Скрипты не доверяют значению: нода CT находится в /cluster/resources, расхождение — ошибка.
PROXMOX_NODE="${PROXMOX_NODE:-pve-node1}"

# Хаб.
HUB_CTID="${HUB_CTID:-101}"
HUB_IP="${HUB_IP:-192.0.2.10}"
HUB_BASE="${HUB_BASE:-/opt/canterlot}"
HUB_RELEASES="${HUB_RELEASES:-/opt/canterlot/releases}"
HUB_CURRENT="${HUB_CURRENT:-/opt/canterlot/current}"
HUB_CONFIG="${HUB_CONFIG:-/etc/canterlot/hub.toml}"
HUB_UNIT="${HUB_UNIT:-canterlot-hub}"
HUB_BACKUP_DIR="${HUB_BACKUP_DIR:-/var/backups/canterlot}"
HUB_PG_SOCKET="${HUB_PG_SOCKET:-/var/run/postgresql}"
HUB_PG_DB="${HUB_PG_DB:-canterlot}"
HUB_PG_USER="${HUB_PG_USER:-canterlot}"
PBS_STORAGE="${PBS_STORAGE:-backup_storage}"
# База DB-IP City Lite для мест входа. Путь выкат спрашивает у хаба
# (canterlot-hub geoip path: [auth.geoip].path из hub.toml) и обновляет файл командой
# canterlot-hub geoip update, если его нет или он старше GEOIP_MAX_AGE_DAYS дней.
# HUB_GEOIP_PATH подменяет ответ хаба (только тесты).
HUB_GEOIP_PATH="${HUB_GEOIP_PATH:-}"
GEOIP_MAX_AGE_DAYS="${GEOIP_MAX_AGE_DAYS:-35}"

# PWA и Caddy на web.
SITE_ORIGIN="${SITE_ORIGIN:-https://hub.example.com}"
WSS_ORIGIN="${WSS_ORIGIN:-wss://hub.example.com}"
WEB_SITES_BASE="${WEB_SITES_BASE:-/srv/caddy/sites/canterlot}"
WEB_RELEASES="${WEB_RELEASES:-/srv/caddy/sites/canterlot/releases}"
WEB_BUILD_LINK="${WEB_BUILD_LINK:-/srv/caddy/sites/canterlot/build}"
WEB_ENV="${WEB_ENV:-/srv/caddy/canterlot.env}"
WEB_COMPOSE_DIR="${WEB_COMPOSE_DIR:-/srv/caddy}"
WEB_CONTAINER="${WEB_CONTAINER:-caddy}"
# Путь к version.json внутри контейнера Caddy (с элементом build/).
WEB_CONTAINER_VERSION_JSON="${WEB_CONTAINER_VERSION_JSON:-/srv/canterlot/web/build/_app/version.json}"

# Ожидаемые коды остальных сайтов (только коды, без тел и заголовков).
# Сайт хаба отдаёт оболочку PWA без входа (вход — в самом хабе); выключенные
# узлы в набор не входят.
SITE_CODES="${SITE_CODES:-hub.example.com:200 git.example.com:200}"

# Воркер на этой машине.
WORKER_BASE="${WORKER_BASE:-${HOME}/.local/opt/canterlot}"
WORKER_RELEASES="${WORKER_RELEASES:-${HOME}/.local/opt/canterlot/releases}"
WORKER_CURRENT="${WORKER_CURRENT:-${HOME}/.local/opt/canterlot/current}"
WORKER_CONFIG="${WORKER_CONFIG:-${HOME}/.config/canterlot/worker.toml}"
WORKER_DATA="${WORKER_DATA:-${HOME}/.local/state/canterlot-worker}"
WORKER_UNIT="${WORKER_UNIT:-canterlot-worker}"
# Сокеты сессий (<exec-id>.sock): проверка обслуживания ждёт по одному на живую сессию.
WORKER_SOCKET_DIR="${WORKER_SOCKET_DIR:-/run/user/$(id -u)/canterlot}"
# Каталог пользовательских юнитов systemd (там лежит файл canterlot-worker.service).
WORKER_UNIT_DIR="${WORKER_UNIT_DIR:-${XDG_CONFIG_HOME:-${HOME}/.config}/systemd/user}"

# Состав корня stagedir веб-релиза в конфиге НЕ зашит: сборка меняется между релизами
# (service-worker.js убран в 1.0.0, появляются новые файлы). Ожидаемый список берётся из
# собранного dist/<sha>/web, а stagedir обязан совпасть с ним в точности (lib.sh: web_top_entries).

# Сколько релизов держать на каждом компоненте (плюс каждый релиз, из которого живёт процесс).
RETAIN_COUNT="${RETAIN_COUNT:-3}"
